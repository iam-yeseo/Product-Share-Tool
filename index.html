<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 등록 요청 툴</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="view-editor">

<!-- ===== 상단 GNB ===== -->
<header class="gnb">
  <div class="gnb-left">
    <button id="btnSidebar" class="icon-btn" title="목록 접기 / 펼치기">☰</button>
    <span class="logo">상품 등록 요청</span>
  </div>

  <div class="gnb-center">
    <div class="view-switch" role="tablist" aria-label="화면 모드">
      <button class="vs-btn is-active" data-view="editor" role="tab">편집자</button>
      <button class="vs-btn" data-view="registrar" role="tab">등록자</button>
    </div>
  </div>

  <div class="gnb-right">
    <span id="syncState" class="sync-state" title="온라인 동기화 상태">연결 중…</span>
    <span id="dirtyBadge" class="dirty-badge" hidden>저장 안 됨</span>
    <button id="btnSave" class="btn btn-primary only-editor" disabled>편집 완료 · 저장</button>
  </div>
</header>

<div class="layout">

  <!-- ===== 사이드바 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <button id="btnNewList" class="btn btn-primary btn-block">+ 새 리스트 등록</button>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="리스트 · 작성자 검색" autocomplete="off">
      </div>
    </div>
    <nav id="listNav" class="list-nav"><p class="empty-hint">불러오는 중…</p></nav>
  </aside>
  <div class="sidebar-dim" id="sidebarDim"></div>

  <!-- ===== 본문 ===== -->
  <main class="main">

    <section id="emptyState" class="empty-state">
      <h2>리스트를 선택하세요</h2>
      <p>왼쪽에서 리스트를 고르거나 <b>+ 새 리스트 등록</b>으로 새로 만들 수 있습니다.</p>
    </section>

    <section id="listPane" hidden>
      <!-- 리스트 헤더 -->
      <div class="list-head">
        <div class="lh-title">
          <input id="listTitle" class="title-input" placeholder="리스트 제목" maxlength="80">
          <span id="listTitleRO" class="title-ro"></span>
        </div>
        <div class="lh-meta">
          <label class="meta-field">
            <span class="meta-label">작성일 <b class="req">*</b></span>
            <input id="listDate" type="date" class="meta-input">
            <span id="listDateRO" class="meta-ro"></span>
          </label>
          <label class="meta-field">
            <span class="meta-label">작성자 <b class="req">*</b></span>
            <input id="listAuthor" type="text" class="meta-input" placeholder="이름 입력" maxlength="30">
            <span id="listAuthorRO" class="meta-ro"></span>
          </label>
          <div class="meta-field meta-stat">
            <span class="meta-label">등록 진행</span>
            <span id="listProgress" class="meta-ro">0 / 0</span>
          </div>
          <div class="lh-actions">
            <button id="btnDeleteList" class="btn btn-danger-ghost only-editor">리스트 삭제</button>
          </div>
        </div>
      </div>

      <!-- 테이블 -->
      <div class="table-wrap">
        <table class="grid" id="grid">
          <colgroup id="gridCols">
            <col data-key="check"><col data-key="seq"><col data-key="brand">
            <col data-key="name_own"><col data-key="name_naver"><col data-key="model">
            <col data-key="content"><col data-key="image_usage">
            <col data-key="need_retail"><col data-key="need_wholesale"><col data-key="need_naver">
            <col data-key="price_retail"><col data-key="price_wholesale"><col data-key="price_naver">
            <col data-key="image"><col data-key="ref_link"><col data-key="note"><col data-key="act">
          </colgroup>
          <thead>
            <tr>
              <th rowspan="2" class="c-check">
                <span class="th-label">체크</span>
                <input type="checkbox" id="chkAll" class="chk-all only-editor" title="전체 선택 / 해제">
              </th>
              <th rowspan="2" class="c-seq" data-col="1">순번<i class="col-resizer"></i></th>
              <th rowspan="2" class="c-brand" data-col="2">브랜드<i class="col-resizer"></i></th>
              <th colspan="2" class="grp">상품명</th>
              <th rowspan="2" class="c-model" data-col="5">모델명<i class="col-resizer"></i></th>
              <th rowspan="2" class="c-content" data-col="6">내용<i class="col-resizer"></i></th>
              <th rowspan="2" class="c-imguse" data-col="7">이미지 사용 여부<i class="col-resizer"></i></th>
              <th colspan="3" class="grp">등록 필요</th>
              <th colspan="3" class="grp">가격</th>
              <th rowspan="2" class="c-image" data-col="14">이미지<i class="col-resizer"></i></th>
              <th rowspan="2" class="c-link" data-col="15">참고 링크<i class="col-resizer"></i></th>
              <th rowspan="2" class="c-note" data-col="16">비고<i class="col-resizer"></i></th>
              <th rowspan="2" class="c-act only-editor-cell" data-col="17">관리</th>
            </tr>
            <tr>
              <th class="sub c-name" data-col="3">자사몰<i class="col-resizer"></i></th>
              <th class="sub c-name" data-col="4">네이버<i class="col-resizer"></i></th>
              <th class="sub c-need" data-col="8">소매몰<i class="col-resizer"></i></th>
              <th class="sub c-need" data-col="9">도매몰<i class="col-resizer"></i></th>
              <th class="sub c-need" data-col="10">네이버<i class="col-resizer"></i></th>
              <th class="sub c-price" data-col="11">소매몰<i class="col-resizer"></i></th>
              <th class="sub c-price" data-col="12">도매몰<i class="col-resizer"></i></th>
              <th class="sub c-price" data-col="13">네이버<i class="col-resizer"></i></th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="table-foot only-editor">
        <button id="btnAddRow" class="btn btn-ghost">+ 행 추가</button>
        <button id="btnCopyRows" class="btn btn-ghost" disabled>행 복사</button>
        <button id="btnDeleteRows" class="btn btn-ghost btn-danger-line" disabled>행 삭제</button>
        <span class="foot-div"></span>
        <button id="btnImport" class="btn btn-ghost">엑셀 불러오기</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
        <span id="selCount" class="sel-count">행을 체크하면 복사·삭제할 수 있습니다</span>
        <span class="foot-hint">저장을 눌러야 다른 사람에게 반영됩니다.</span>
      </div>
    </section>
  </main>
</div>

<!-- 엑셀 불러오기 확인 창 -->
<div id="importModal" class="modal" hidden>
  <div class="modal-box">
    <h3 class="modal-title">엑셀 불러오기</h3>
    <p id="imFile" class="modal-file"></p>
    <div id="imSummary" class="im-summary"></div>
    <div class="modal-opts">
      <label><input type="radio" name="imMode" value="replace" checked> 지금 표를 <b>지우고</b> 새로 채우기</label>
      <label><input type="radio" name="imMode" value="append"> 지금 표 <b>아래에 이어</b> 붙이기</label>
    </div>
    <p class="modal-hint">불러온 뒤 <b>편집 완료 · 저장</b>을 눌러야 실제로 저장됩니다.</p>
    <div class="modal-foot">
      <button id="imCancel" class="btn">취소</button>
      <button id="imApply" class="btn btn-primary">불러오기</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/xlsxImport.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
